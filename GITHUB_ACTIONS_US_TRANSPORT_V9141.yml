name: U.S. transport V9.14.1 clean-checkout validation
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-v914.txt
      - name: Install reproducible environment
        run: python -m pip install -r requirements-v914.txt
      - name: Python syntax, GitHub layout and source checks
        run: python us9141_repo_check.py
      - name: Core computational and figure checks
        run: python us914_validate.py
      - name: Rebuild in isolated flat directory
        run: python us914_validate.py --full
